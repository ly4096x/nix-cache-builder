; Process supervisor for the nix-cache-builder container.
;
; Runs three programs and restarts any that die.  All stdout/stderr is
; routed to PID 1 so `docker logs nix-cache-builder` shows everything.

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
; Disable the supervisor's own log file — child output goes to fd 1/2.
logfile=/dev/null
logfile_maxbytes=0

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; -- nix-daemon (root) ----------------------------------------------------
; Owns /nix/store and provides /nix/var/nix/daemon-socket — everything
; else in this container talks to it.  Starts first.
[program:nix-daemon]
command=/usr/local/bin/nix-daemon
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; -- nix-serve (nixbuild) -------------------------------------------------
; HTTP binary cache, runs unprivileged.  nix-serve issues nix-store
; queries that talk to the daemon socket, so we wait for the socket
; before starting to avoid a restart loop on cold boot.
;
; killasgroup/stopasgroup makes supervisord signal Starman's whole
; process group, so prefork workers go down with the parent instead of
; lingering and holding port 5000.  startretries=30 covers the
; worker-shutdown window if the parent dies but workers haven't.
[program:nix-serve]
; pkill at the start: if a previous nix-serve master was SIGKILL'd from
; outside, its prefork workers can outlive it and keep port 5000 bound.
; The leftover workers belong to nixbuild, so pkill -u limits the blast
; radius to this user's processes.
command=bash -c 'pkill -KILL -u nixbuild -f "starman (master|worker)" 2>/dev/null; until [ -S /nix/var/nix/daemon-socket/socket ]; do sleep 0.25; done; exec nix-serve --listen 0.0.0.0:5000'
user=nixbuild
environment=NIX_SECRET_KEY_FILE="/shared/keys/cache-priv-key.pem",HOME="/home/nixbuild",PATH="/usr/local/bin:/root/.nix-profile/bin"
priority=20
autorestart=true
startsecs=2
startretries=30
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; -- sshd (root) ----------------------------------------------------------
; killasgroup/stopasgroup so per-connection forks (-D mode forks a child
; per session) go down with the parent on container stop.
[program:sshd]
command=/usr/local/bin/sshd -D -e
priority=30
autorestart=true
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
