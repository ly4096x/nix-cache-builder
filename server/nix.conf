experimental-features = nix-command flakes
trusted-users = root nixbuild
allowed-users = *
# Sandbox disabled: user-namespace sandboxing collides with container namespaces
# (especially under rootless podman). Build isolation still comes from the
# dedicated nixbld* build users.
# Can be overridden at runtime with NIX_SANDBOX=true (entrypoint appends a
# `sandbox =` line that wins).  ccache hits are far more reliable with the
# sandbox on, because builds then run in a deterministic /build directory.
sandbox = false
max-jobs = auto
cores = 0

# ccache: make the shared compiler cache visible inside the build sandbox.
# Harmless when sandbox = false (the path is reachable anyway); required
# once sandbox = true so ccacheStdenv builds can read/write the cache.
# entrypoint.sh creates the directory (root:nixbld, setgid) on boot.
extra-sandbox-paths = /nix/var/cache/ccache
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
