# One container runs both the Nix remote builder (sshd) and the binary
# cache (nix-serve).  A separate verifier container exercises both paths.
#
# Usage:
#   docker compose up -d nix-builder              # just the server
#   docker compose run --rm verifier              # one-shot verification
#   docker compose up --abort-on-container-exit \
#       --exit-code-from verifier                 # both, exit on verify result

services:
  nix-builder:
    build:
      context: ./server
    image: nix-cache-builder:latest
    container_name: nix-cache-builder
    hostname: nix-builder
    networks: [nix-net]
    ports:
      - "2222:22"      # ssh-ng remote builder
      - "5000:5000"    # nix-serve binary cache
    volumes:
      - nix-store:/nix
      - nix-builder-keys:/shared/keys
    # Allow build-time unprivileged user namespaces.  Docker's default
    # seccomp profile denies unshare(CLONE_NEWUSER) for the unprivileged
    # nixbld* build users, which breaks derivations whose *build* opens a
    # userns — notably filesystem-image builders that must emit a
    # root-owned tree (e.g. `unshare --map-root-user … mkfs.btrfs -r`).
    # Verified on real Docker 20.10: as an unprivileged user the probe
    # fails "unshare: Operation not permitted" by default and maps uid 0
    # with this set.  (podman's default profile already allows it, so
    # this is a no-op there; and it's separate from NIX_SANDBOX — the
    # root nix-daemon's own sandbox doesn't need it.)
    # The host kernel must also permit it — on a restrictive host set
    # `sysctl kernel.unprivileged_userns_clone=1` and a non-zero
    # `user.max_user_namespaces` (Ubuntu 24.04 also needs
    # `kernel.apparmor_restrict_unprivileged_userns=0`).
    # Hardening: replace `unconfined` with a custom profile that is the
    # Docker default plus unshare/clone/setns carrying the NEW* flags.
    security_opt:
      - seccomp:unconfined
    environment:
      # Pubkeys appended to nixbuild's authorized_keys (one per line):
      #   AUTHORIZED_KEYS="$(cat ~/.ssh/id_ed25519.pub)" docker compose up -d
      # Or mount a directory of *.pub files at /shared/authorized_keys.d.
      AUTHORIZED_KEYS: ${AUTHORIZED_KEYS:-}
      # Foreign systems this builder will accept, space separated (e.g.
      # "aarch64-linux").  Empty by default: nix rejects a foreign
      # derivation up front with "platform mismatch", which is a much
      # better failure than accepting it and dying on "Exec format
      # error" halfway through.  Only set this for platforms whose
      # binfmt handler is actually registered — see the `binfmt`
      # service below.
      EXTRA_PLATFORMS: ${EXTRA_PLATFORMS:-}
    restart: unless-stopped

  # One-shot: installs qemu-user binfmt_misc handlers into the HOST
  # kernel, then exits.  Not started by `docker compose up` — it is
  # behind a profile because it needs privileges and mutates host state:
  #
  #   docker compose --profile binfmt up binfmt          # register
  #   PLATFORMS="aarch64-linux riscv64-linux" \
  #     docker compose --profile binfmt up binfmt        # more arches
  #   UNREGISTER=1 docker compose --profile binfmt up binfmt   # remove
  #
  # binfmt_misc is kernel-global rather than per-namespace, so what this
  # registers is visible to every container on the host (and to the host
  # itself).  Registrations last until reboot or an explicit unregister.
  # The handlers use the F flag, so they keep working after this
  # container is gone and the nix-builder needs no qemu of its own.
  binfmt:
    build:
      context: ./binfmt
    image: nix-cache-binfmt:latest
    container_name: nix-cache-binfmt
    profiles: ["binfmt"]
    # Writing to /proc/sys/fs/binfmt_misc/register needs CAP_SYS_ADMIN in
    # the initial user namespace.
    privileged: true
    volumes:
      # Essential, not a convenience.  Since Linux 6.7 binfmt_misc is
      # scoped per mount instance: if this container mounts its own, the
      # registrations live in a private instance and vanish with the
      # container — the registration "succeeds" and changes nothing.
      # Bind-mounting the host's instance is what makes the writes land
      # where every other container can see them.  It also means the
      # host must already have binfmt_misc mounted (systemd normally
      # does it; otherwise `mount -t binfmt_misc binfmt_misc
      # /proc/sys/fs/binfmt_misc` once, as root, on the host).
      - /proc/sys/fs/binfmt_misc:/proc/sys/fs/binfmt_misc
    environment:
      PLATFORMS: ${PLATFORMS:-aarch64-linux}
      UNREGISTER: ${UNREGISTER:-}
    restart: "no"

  verifier:
    build:
      context: ./verifier
    image: nix-cache-verifier:latest
    container_name: nix-cache-verifier
    depends_on:
      - nix-builder
    networks: [nix-net]
    environment:
      SERVER_HOST: nix-builder
      SERVER_SSH_PORT: "22"
      SERVER_HTTP_PORT: "5000"
    volumes:
      - nix-builder-keys:/shared/keys:ro
    # Run-once: this container exists to assert success, not to stay up.
    restart: "no"

networks:
  nix-net:
    driver: bridge

volumes:
  nix-store:
  nix-builder-keys:
