# CI: build both images, run the verifier end-to-end, then (on push to
# main or a v* tag) publish the server image to ghcr.io.
#
# The publish job is gated on `verify` so a broken server can never be
# tagged `latest`.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build server + verifier images
        run: docker compose build

      - name: Start nix-builder
        run: |
          docker compose up -d nix-builder
          # Wait for the binary cache HTTP endpoint to come up; the
          # verifier has its own waits but failing fast here keeps logs
          # readable when the server itself is broken.
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:5000/nix-cache-info >/dev/null 2>&1; then
              echo "cache up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::nix-serve did not come up within 60s"
          docker compose logs nix-builder
          exit 1

      - name: Run verifier
        run: docker compose run --rm verifier

      - name: Server logs (on failure)
        if: failure()
        run: docker compose logs --no-color nix-builder

      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
